<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laya Decision Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Sora:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div>
          <p class="brand">Laya Decision</p>
          <p class="tagline">本地 / 线上结构化决策 · Snake &amp; 横卷游戏判定</p>
        </div>
        <div id="health" class="pill">connecting…</div>
      </header>

      <main class="layout">
        <section class="board-panel">
          <div class="game-tabs">
            <button type="button" class="tab active" data-game="platform" id="tab-platform">横卷游戏判定</button>
            <button type="button" class="tab" data-game="snake" id="tab-snake">贪吃蛇</button>
          </div>
          <canvas id="board" width="768" height="448" aria-label="Game board"></canvas>
          <p id="platform-hint" class="hint">← → 移动 · Z/空格 跳跃 · ↓/C 蹲下（躲弹 / 捡钥匙）</p>
        </section>

        <aside class="side">
          <section class="block">
            <h2>控制</h2>
            <label>
              Provider
              <select id="provider"></select>
            </label>
            <label id="mode-label">
              Mode
              <select id="mode">
                <option value="human">human（键盘）</option>
                <option value="agent" selected>agent（模型）</option>
              </select>
            </label>
            <label id="fps-label">
              <span id="fps-name">Decision Hz</span>
              <input id="fps" type="number" min="0.5" max="30" step="0.5" value="8" />
            </label>
            <label>
              Seed
              <input id="seed" type="number" value="" placeholder="随机" />
            </label>
            <div class="actions">
              <button id="start" type="button">开始</button>
              <button id="pause" type="button" disabled>暂停</button>
              <button id="resume" type="button" disabled>恢复</button>
              <button id="reset" type="button" disabled>重开</button>
              <button id="stop" type="button" disabled>停止</button>
            </div>
          </section>

          <section class="block">
            <h2>状态</h2>
            <dl id="stats" class="stats">
              <div><dt>Session</dt><dd id="stat-session">—</dd></div>
              <div><dt>Status</dt><dd id="stat-status">idle</dd></div>
              <div><dt>Score</dt><dd id="stat-score">0</dd></div>
              <div><dt>Ticks / Dist</dt><dd id="stat-ticks">0</dd></div>
              <div><dt>Proposed</dt><dd id="stat-proposed">—</dd></div>
              <div><dt>Executed</dt><dd id="stat-executed">—</dd></div>
              <div><dt>Intervened</dt><dd id="stat-intervened">—</dd></div>
              <div><dt>Latency</dt><dd id="stat-latency">—</dd></div>
            </dl>
          </section>

          <section class="block">
            <h2 id="probs-title">方向概率</h2>
            <div id="probs" class="probs"></div>
          </section>

          <section class="block">
            <h2>日志</h2>
            <pre id="log" class="log"></pre>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
